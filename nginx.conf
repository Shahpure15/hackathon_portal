events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone for PS Selection endpoint
    # Allow 1 request per second per IP, with a burst of up to 5 requests
    limit_req_zone $binary_remote_addr zone=ps_select_limit:10m rate=1r/s;

    upstream backend_server {
        server backend:8000;
    }

    upstream frontend_server {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Max body size for CSV uploads (2MB)
        client_max_body_size 2M;

        # Rate limited endpoint for Problem Statement selection
        location /api/leader/select-ps {
            limit_req zone=ps_select_limit burst=5 nodelay;
            
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API routing (stripping /api prefix)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Routing to Vite frontend dev server (development setup)
        location / {
            proxy_pass http://frontend_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
