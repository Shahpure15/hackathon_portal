services:
  # -------------------------------------------------------------
  # Backend FastAPI Web Service
  # -------------------------------------------------------------
  - type: web
    name: hackathon-portal-backend
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mitindia.vercel.app,https://mitinida-hackathon-portal.vercel.app,https://hackathon.mitindia.com,https://www.hackathon.mitindia.com"
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: ""
      - key: FRONTEND_BASE_URL
        value: "https://mitindia.vercel.app"
      - key: EMAIL_WORKER_ENABLED
        value: "true"

  # -------------------------------------------------------------
  # Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: hackathon-portal-frontend
    runtime: static
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    headers:
      - path: "/*"
        name: "X-Frame-Options"
        value: "DENY"
      - path: "/assets/*"
        name: "Cache-Control"
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
